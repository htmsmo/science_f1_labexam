<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虛擬科學實驗室平台</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* 主平台頂部導航列 */
        .portal-header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 54px;
            z-index: 1000;
        }

        .portal-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f8fafc;
            font-weight: bold;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        .portal-brand span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 實驗選擇標籤頁 */
        .exp-selector-container {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 8px;
            scrollbar-width: thin;
        }

        .exp-tab {
            background-color: #334155;
            color: #94a3b8;
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .exp-tab:hover {
            background-color: #475569;
            color: #f8fafc;
        }

        .exp-tab.active {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        .exp-tab .badge {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* 模擬器載入區 */
        .stage-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 54px);
            position: relative;
            background-color: #0f172a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            .portal-brand span {
                display: none;
            }
            .exp-tab {
                padding: 5px 10px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

    <!-- 平台頂部導航列 -->
    <header class="portal-header">
        <div class="portal-brand">
            🔬 <span>虛擬科學實驗室</span>
        </div>

        <div class="exp-selector-container">
            <button class="exp-tab active" onclick="switchLab('bunsen', this)">
                🧪 本生燈加熱水 <span class="badge">已上線</span>
            </button>
            <button class="exp-tab" onclick="switchLab('titration', this)">
                ⚖️ 酸鹼滴定實驗 <span class="badge">籌備中</span>
            </button>
            <button class="exp-tab" onclick="switchLab('induction', this)">
                🧲 電磁感應實驗 <span class="badge">籌備中</span>
            </button>
            <button class="exp-tab" onclick="switchLab('optics', this)">
                🌈 光線折射與反射 <span class="badge">籌備中</span>
            </button>
        </div>
    </header>

    <!-- 模擬器內容展示區 -->
    <div class="stage-container">
        <iframe id="lab-frame" title="實驗模擬器展示區"></iframe>
    </div>

    <!-- 本生燈實驗原始碼存放區 -->
    <template id="bunsen-code">
<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <style>
        :root {

        .toolbox h2 { font-size: 0.85rem; color: var(--primary-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 4px; display: flex; justify-content: space-between; }

        .guide-panel { width: 240px; background: var(--panel-bg); border-left: 1px solid var(--border-color); padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }

        .dashboard { background: #2c3e50; color: #00ffcc; padding: 8px; border-radius: 6px; font-family: monospace; display: flex; flex-direction: column; gap: 4px; margin-top: auto; font-size: 0.8rem; }
        .dashboard-row { display: flex; justify-content: space-between; }
        .dash-val { font-size: 1rem; font-weight: bold; }
        @media (max-width: 950px), (max-height: 500px) {

        }
    </style>
</head>

    <script>
        const toolsData = [
            { id: 'mat', name: '防火墊', icon: '<svg width="35" height="8" viewBox="0 0 100 20"><rect x="0" y="0" width="100" height="20" fill="#95a5a6" rx="3"/></svg>' },

            { id: 'gauze', name: '鐵絲網', icon: '<svg width="35" height="15" viewBox="0 0 100 30"><rect x="5" y="5" width="90" height="20" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="4,2"/></svg>' },
            { id: 'beaker', name: '燒杯(水)', icon: '<svg width="30" height="35" viewBox="0 0 80 100"><path d="M10,10 L10,90 Q10,95 15,95 L65,95 Q70,95 70,90 L70,10" fill="none" stroke="#3498db" stroke-width="5"/><rect x="12" y="40" width="56" height="52" fill="#3498db" opacity="0.5"/></svg>' },
            { id: 'burner', name: '本生燈', icon: '<svg width="25" height="35" viewBox="0 0 60 100"><rect x="10" y="80" width="40" height="15" fill="#34495e"/><rect x="25" y="20" width="10" height="60" fill="#7f8c8d"/></svg>' },
            { id: 'stand', name: '鐵架/夾', icon: '<svg width="25" height="35" viewBox="0 0 60 100"><rect x="10" y="85" width="40" height="10" fill="#2c3e50"/><rect x="15" y="10" width="6" height="75" fill="#7f8c8d"/><rect x="18" y="25" width="25" height="6" fill="#e74c3c"/></svg>' },
            { id: 'thermometer', name: '溫度計', icon: '<svg width="12" height="35" viewBox="0 0 20 100"><rect x="7" y="0" width="6" height="85" fill="#e5e8e8" stroke="#bdc3c7" stroke-width="1" rx="3"/><circle cx="10" cy="85" r="7" fill="#e74c3c"/></svg>' }
        ];
        const stepTools = ['mat', 'tripod', 'gauze', 'beaker', 'burner', 'stand', 'thermometer'];
        let currentMode = 'review', currentStep = 0, temperature = 25.0, isAirOpen = true, isGasOpen = false, isLit = false, isNonLuminous = false, timer = null;
        const stage = document.getElementById('stage'), panContainer = document.getElementById('pan-container'), btnAir = document.getElementById('btn-air'), btnGas = document.getElementById('btn-gas'), btnLighter = document.getElementById('btn-lighter'), btnReset = document.getElementById('btn-reset'), statusTag = document.getElementById('status-tag'), toolsContainer = document.getElementById('tools-container');

        function renderToolbox() {

                const div = document.createElement('div');
                div.className = 'tool-item'; div.setAttribute('draggable', 'true'); div.id = `tool-${tool.id}`; div.dataset.tool = tool.id;
                const displayName = (currentMode === 'review') ? `${stepTools.indexOf(tool.id)+1}. ${tool.name}` : tool.name;
                div.innerHTML = `<div class="tool-icon">${tool.icon}</div><div class="tool-name">${displayName}</div>`;
                div.addEventListener('dragstart', handleDragStart); div.addEventListener('touchstart', handleTouchStart, {passive: false}); div.addEventListener('touchmove', handleTouchMove, {passive: false}); div.addEventListener('touchend', handleTouchEnd);
                toolsContainer.appendChild(div);
            });
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            if (currentMode === 'exam' && currentStep > 0 && currentStep < 12) { if (!confirm('切換模式將視為「放棄考試」，確定切換？')) return; }
            currentMode = mode;
            document.getElementById('btn-mode-review').classList.toggle('active', mode === 'review');
            document.getElementById('btn-mode-exam').classList.toggle('active', mode === 'exam');
            document.getElementById('steps-list').style.display = (mode === 'exam') ? 'none' : 'flex';
            document.getElementById('exam-mask').style.display = (mode === 'exam') ? 'block' : 'none';
            btnReset.innerText = (mode === 'exam') ? '🏳️ 放棄重來' : '🔄 重置';
            statusTag.innerText = (mode === 'exam') ? '📝 考試模式進行中' : '📖 複習模式';
            resetExperiment();
        }

        let viewScale = 1, panX = 0, panY = 0, isPanning = false, isDraggingTool = false, startX = 0, startY = 0, initialPinchDist = null, initialScale = 1;
        function autoFitView() {
            const h = stage.clientHeight;
            if (h < 450) { viewScale = Math.max(0.4, h / 500); panY = -30; } else { viewScale = 1; panY = 0; }
            panX = 0; updateTransform();
        }
        window.addEventListener('resize', autoFitView);
        window.addEventListener('load', () => { autoFitView(); renderToolbox(); });
        function updateTransform() { panContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${viewScale})`; }
        function zoomView(delta) { viewScale = Math.max(0.4, Math.min(viewScale + delta, 2.5)); updateTransform(); }
        function resetViewPort() { panContainer.classList.add('smooth'); autoFitView(); setTimeout(() => panContainer.classList.remove('smooth'), 300); }

        stage.addEventListener('mousedown', (e) => {
            if (e.target.closest('.controls-panel') || e.target.closest('.zoom-controls') || e.target.closest('.slot')) return;
            isPanning = true; panContainer.classList.remove('smooth'); startX = e.clientX - panX; startY = e.clientY - panY;
        });
        window.addEventListener('mousemove', (e) => { if (isPanning) { panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); } });
        window.addEventListener('mouseup', () => { isPanning = false; });

        stage.addEventListener('touchstart', (e) => {
            if (isDraggingTool || e.target.closest('.controls-panel') || e.target.closest('.zoom-controls')) return;
            panContainer.classList.remove('smooth');
            if (e.touches.length === 1) { isPanning = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY; }
            else if (e.touches.length === 2) { isPanning = false; initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); initialScale = viewScale; }
        }, {passive: false});

        stage.addEventListener('touchmove', (e) => {
            if (isDraggingTool || e.target.closest('.controls-panel') || e.target.closest('.zoom-controls')) return;
            e.preventDefault();
            if (isPanning && e.touches.length === 1) { panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; updateTransform(); }
            else if (e.touches.length === 2 && initialPinchDist) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                viewScale = Math.max(0.4, Math.min(initialScale * (dist / initialPinchDist), 2.5)); updateTransform();
            }
        }, {passive: false});
        stage.addEventListener('touchend', () => { isPanning = false; initialPinchDist = null; });

        let draggedTool = null, touchClone = null;
        function handleDragStart(e) { if(e.currentTarget.classList.contains('disabled')) return; draggedTool = e.currentTarget.dataset.tool; e.dataTransfer.setData('text/plain', draggedTool); }
        stage.addEventListener('dragover', (e) => e.preventDefault());
        stage.addEventListener('drop', (e) => { e.preventDefault(); checkAndPlace(e.dataTransfer.getData('text/plain')); });

        function handleTouchStart(e) {
            if (e.currentTarget.classList.contains('disabled')) return;
            isDraggingTool = true; draggedTool = e.currentTarget.dataset.tool;
            touchClone = e.currentTarget.cloneNode(true);
            touchClone.style.position = 'fixed'; touchClone.style.zIndex = '9999'; touchClone.style.opacity = '0.8'; touchClone.style.pointerEvents = 'none'; touchClone.style.width = e.currentTarget.offsetWidth + 'px';
            touchClone.classList.remove('tool-item'); touchClone.style.background = '#ebf5fb'; touchClone.style.border = '2px dashed #3498db';
            document.body.appendChild(touchClone); updateClonePosition(e.touches[0]);
        }
        function handleTouchMove(e) { if (touchClone) { e.preventDefault(); updateClonePosition(e.touches[0]); } }
        function updateClonePosition(touch) { if (!touchClone) return; touchClone.style.left = (touch.clientX - touchClone.offsetWidth / 2) + 'px'; touchClone.style.top = (touch.clientY - touchClone.offsetHeight / 2) + 'px'; }
        function handleTouchEnd(e) {
            if (touchClone) {
                touchClone.remove(); touchClone = null;
                const touch = e.changedTouches[0]; const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
                if (dropTarget && (dropTarget.id === 'stage' || dropTarget.closest('#stage'))) checkAndPlace(draggedTool);
                draggedTool = null; setTimeout(() => { isDraggingTool = false; }, 50);
            }
        }

        function checkAndPlace(toolType) {
            if (!toolType) return;
            if (currentStep < 7) {
                if (toolType === stepTools[currentStep]) {
                    document.getElementById(`slot-${toolType}`).style.display = 'block';
                    const card = document.getElementById(`tool-${toolType}`);
                    if(card) { card.classList.add('disabled'); card.setAttribute('draggable', 'false'); }
                    advanceStep();
                } else alert('⚠️ 順序錯誤！請按照正確的實驗步驟放置器材。');
            } else alert('⚠️ 器材已放置完畢，請進行後續的操作。');
        }

        function advanceStep() {
            if (currentMode === 'review') {
                document.getElementById(`step-${currentStep}`)?.classList.remove('active');
                document.getElementById(`step-${currentStep}`)?.classList.add('completed');
            }
            currentStep++;
            if (currentMode === 'review' && currentStep <= 12) {
                const nextStep = document.getElementById(`step-${currentStep}`);
                if (nextStep) { nextStep.classList.add('active'); nextStep.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
            }
            if (currentStep === 7) statusTag.innerText = "器材已齊備，開煤氣前請先【關閉氣孔】";
        }

        btnAir.addEventListener('click', () => {
            if (currentStep < 7) return alert("⚠️ 操作錯誤：請先依次序擺放好所有實驗器材！");
            if (currentStep === 7) {
                isAirOpen = false; btnAir.innerText = "🌀 氣孔 (關)"; btnAir.classList.add('active-on');
                document.getElementById('air-hole').setAttribute('fill', '#95a5a6');
                document.getElementById('air-status').innerText = "關閉"; document.getElementById('air-status').style.color = "#2ecc71";
                statusTag.innerText = "氣孔已關閉，請開啟煤氣"; advanceStep(); return;
            }
            if (currentStep === 8 || currentStep === 9) return alert("⚠️ 安全警告：開啟煤氣與點火前，氣孔必須保持關閉！");
            if (currentStep === 10) {
                isAirOpen = true; isNonLuminous = true; btnAir.innerText = "🌀 氣孔 (開)"; btnAir.classList.remove('active-on');
                document.getElementById('air-hole').setAttribute('fill', '#000');
                document.getElementById('air-status').innerText = "開啟"; document.getElementById('air-status').style.color = "#e67e22";
                updateFlameState(); advanceStep(); startMainLoop(); statusTag.innerText = "無光焰加熱中。實驗結束時請先【關閉氣孔】"; return;
            }
            if (currentStep === 11) {
                isAirOpen = false; isNonLuminous = false; btnAir.innerText = "🌀 氣孔 (關)"; btnAir.classList.add('active-on');
                document.getElementById('air-hole').setAttribute('fill', '#95a5a6');
                document.getElementById('air-status').innerText = "關閉"; document.getElementById('air-status').style.color = "#2ecc71";
                updateFlameState(); advanceStep(); statusTag.innerText = "已轉回有光焰，請【關閉煤氣】熄滅火焰"; return;
            }
            if (currentStep >= 12) alert("💡 本生燈已安全關閉。");
        });

        btnGas.addEventListener('click', () => {
            if (currentStep < 7) return alert("⚠️ 操作錯誤：請先依次序擺放好所有實驗器材！");
            if (currentStep === 7) return alert("⚠️ 安全警告：開啟煤氣前，必須先關閉氣孔！");
            if (currentStep === 8) {
                isGasOpen = true; btnGas.innerText = "⛽ 煤氣 (開)"; btnGas.classList.add('active-on');
                document.getElementById('gas-status').innerText = "開啟"; document.getElementById('gas-status').style.color = "#2ecc71";
                statusTag.innerText = "煤氣已開啟，請點火"; advanceStep(); return;
            }
            if (currentStep === 9 || currentStep === 10) return alert("⚠️ 安全警告：熄滅本生燈前，必須先關閉氣孔轉為有光焰！");
            if (currentStep === 11) return alert("⚠️ 安全警告：請先點擊「氣孔」將其關閉，再關閉煤氣！");
            if (currentStep === 12) {
                isGasOpen = false; isLit = false; isNonLuminous = false;
                btnGas.innerText = "⛽ 煤氣 (關)"; btnGas.classList.remove('active-on');
                document.getElementById('gas-status').innerText = "關閉"; document.getElementById('gas-status').style.color = "#95a5a6";
                updateFlameState(); advanceStep();
                if (currentMode === 'exam') { statusTag.innerText = "🎉 考試完成！恭喜安全完成實驗！"; setTimeout(() => alert("🎉 恭喜你！成功按照正確步驟完成了本生燈加熱水實驗！"), 200); }
                else statusTag.innerText = "🎉 本生燈已安全熄滅，實驗完成！";
                return;
            }
            if (currentStep > 12) alert("💡 煤氣已關閉。");
        });

        btnLighter.addEventListener('click', () => {
            if (currentStep < 7) return alert("⚠️ 操作錯誤：請先依次序擺放好所有實驗器材！");
            if (currentStep === 7) return alert("⚠️ 安全警告：點火前必須先關閉氣孔並開啟煤氣！");
            if (currentStep === 8) return alert("⚠️ 操作錯誤：請先開啟煤氣，才能點火！");
            if (currentStep === 9) {
                isLit = true; updateFlameState(); statusTag.innerText = "已點燃有光焰！請開啟氣孔轉換為無光焰"; advanceStep(); return;
            }
            if (currentStep >= 10) alert("💡 本生燈已經點燃！");
        });

        function updateFlameState() {
            const flameStatus = document.getElementById('flame-status'), flameGroup = document.getElementById('flame-group'), flameNonLuminous = document.getElementById('flame-nonluminous');
            if (isLit) {
                flameGroup.style.display = 'block';
                if (isNonLuminous) { flameNonLuminous.style.display = 'block'; flameStatus.innerText = "無光焰 (加熱中)"; flameStatus.style.color = "#00d2ff"; }
                else { flameNonLuminous.style.display = 'none'; flameStatus.innerText = "有光焰 (安全焰)"; flameStatus.style.color = "#f1c40f"; }
            } else { flameGroup.style.display = 'none'; flameStatus.innerText = "未點燃"; flameStatus.style.color = "#95a5a6"; }
        }

        function startMainLoop() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                if (isLit && isNonLuminous) temperature += 0.8;
                else if (!isLit) temperature -= 0.3;
                temperature = Math.max(25.0, Math.min(100.0, temperature));
                document.getElementById('temp-display').innerText = temperature.toFixed(1) + " °C";
                document.getElementById('thermo-mercury').setAttribute('height', 25 + (temperature - 25) * 1.1);
                document.getElementById('thermo-mercury').setAttribute('y', 175 - (25 + (temperature - 25) * 1.1));
                document.getElementById('steam').style.display = (temperature > 70) ? 'block' : 'none';
            }, 200);
        }

        function resetExperiment() {
            clearInterval(timer); currentStep = 0; temperature = 25.0; isAirOpen = true; isGasOpen = false; isLit = false; isNonLuminous = false;
            document.querySelectorAll('.slot').forEach(s => s.style.display = 'none');
            document.getElementById('flame-group').style.display = 'none';
            document.getElementById('flame-nonluminous').style.display = 'none';
            document.getElementById('air-hole').setAttribute('fill', '#000');
            document.getElementById('steam').style.display = 'none';

            document.getElementById('temp-display').innerText = "25.0 °C";
            document.getElementById('air-status').innerText = "開啟"; document.getElementById('air-status').style.color = "#e67e22";
            document.getElementById('gas-status').innerText = "關閉"; document.getElementById('gas-status').style.color = "#95a5a6";
            document.getElementById('flame-status').innerText = "未點燃"; document.getElementById('flame-status').style.color = "#95a5a6";
            btnAir.classList.remove('active-on'); btnAir.innerText = "🌀 氣孔 (開)";
            btnGas.classList.remove('active-on'); btnGas.innerText = "⛽ 煤氣 (關)";
            document.getElementById('thermo-mercury').setAttribute('height', 25);
            document.getElementById('thermo-mercury').setAttribute('y', 150);
            document.querySelector('.guide-panel').scrollTop = 0;
            statusTag.innerText = (currentMode === 'exam') ? "📝 考試模式進行中" : "請先依順序擺放器材";
            resetViewPort();
        }

        btnReset.addEventListener('click', () => {
            if (currentMode === 'exam' && currentStep > 0 && currentStep < 12) { if (!confirm('確定要放棄本次考試並重新開始嗎？')) return; }
            resetExperiment();
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); } 
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        }
    </script>
